services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kalpi
      POSTGRES_USER: kalpi
      POSTGRES_PASSWORD: kalpi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalpi -d kalpi"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://kalpi:kalpi@db:5432/kalpi
      DEBUG: ${DEBUG:-false}
      BYPASS_MARKET_HOURS: ${BYPASS_MARKET_HOURS:-true}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-demo}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-demo1234}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-demo@example.com}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
