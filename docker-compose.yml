services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kalpi
      POSTGRES_USER: kalpi
      POSTGRES_PASSWORD: kalpi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalpi -d kalpi"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://kalpi:kalpi@db:5432/kalpi
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
